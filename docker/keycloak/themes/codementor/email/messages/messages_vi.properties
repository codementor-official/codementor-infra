emailVerificationSubject=[CodeMentor] Xác nhận địa chỉ email
emailVerificationBody=Chào bạn,\n\nCảm ơn bạn đã đăng ký CodeMentor. Mở liên kết sau để xác nhận email:\n{0}\n\nLiên kết có hiệu lực trong {3}.\n\nNếu không phải bạn đăng ký, hãy bỏ qua email này.\n\nCodeMentor - Học tốt hơn, lập trình tự tin hơn\nHỗ trợ: codementor.official@gmail.com
passwordResetSubject=[CodeMentor] Đặt lại mật khẩu
passwordResetBody=Chào bạn,\n\nChúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản CodeMentor của bạn. Mở liên kết sau để chọn mật khẩu mới:\n{0}\n\nLiên kết có hiệu lực trong {3} và chỉ dùng được một lần. Nếu bạn không yêu cầu, hãy bỏ qua email này.\n\nCodeMentor - Học tốt hơn, lập trình tự tin hơn\nHỗ trợ: codementor.official@gmail.com
executeActionsSubject=[CodeMentor] Cập nhật tài khoản
executeActionsBody=Chào bạn,\n\nQuản trị viên CodeMentor yêu cầu bạn hoàn tất: {3}. Mở liên kết sau:\n{0}\n\nLiên kết có hiệu lực trong {4}.\n\nCodeMentor - Học tốt hơn, lập trình tự tin hơn\nHỗ trợ: codementor.official@gmail.com
