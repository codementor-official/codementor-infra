emailUpdateConfirmationBody=Chào bạn,\n\nĐể dùng {1} làm email đăng nhập CodeMentor, mở liên kết sau:\n{0}\n\nLiên kết có hiệu lực trong {3}. Nếu bạn không yêu cầu, hãy bỏ qua email này.\n\nCodeMentor - Học tốt hơn, lập trình tự tin hơn
