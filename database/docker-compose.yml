# Local databases for CodeMentor. Ports are offset from the defaults so this never fights
# a PostgreSQL/Mongo already installed on the host.
#
#   docker compose up -d && make init && make seed && make verify

services:
  postgres:
    image: postgres:18-alpine
    container_name: codementor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codementor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codementor}
      POSTGRES_DB: ${POSTGRES_DB:-codementor}
      # Deterministic collation so ORDER BY on Vietnamese text is stable across machines.
      LANG: C.UTF-8
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      # postgres:18+ images store data in a major-version subdirectory and require the mount
      # to be at /var/lib/postgresql, NOT /var/lib/postgresql/data — mounting the old path
      # makes the container exit(1) on boot. See docker-library/postgres#1259.
      - codementor-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codementor} -d ${POSTGRES_DB:-codementor}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    container_name: codementor-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-codementor}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-codementor}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-codementor}
    ports:
      - "${MONGO_PORT:-57017}:27017"
    volumes:
      - codementor-mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  codementor-pgdata:
  codementor-mongodata:
